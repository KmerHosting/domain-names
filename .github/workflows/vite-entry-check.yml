name: Vite entrypoint check

on:
  push:
    branches: [fix-vite-entrypoint]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Ensure production index has no TSX source imports
        run: |
          test -f dist/index.html
          ! grep -q '/src/.*\.tsx' dist/index.html
          grep -q '/assets/' dist/index.html
