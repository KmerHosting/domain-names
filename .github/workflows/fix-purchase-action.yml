name: Repair auth and checkbox layout

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-purchase-action.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic UI repair
        run: python scripts/fix_auth_layout.py
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "KmerHosting Automation"
          git config user.email "support@kmerhosting.com"
          git add src/router.tsx src/router-compat.css
          git commit -m "fix: restore auth layout and labeled checkboxes"
          git push origin HEAD:main
