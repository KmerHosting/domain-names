name: Improve authentication UX

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-purchase-action.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Improve field guidance and password controls
        run: python scripts/improve_auth_ux.py
      - name: Commit UX improvements
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "KmerHosting Automation"
          git config user.email "support@kmerhosting.com"
          git add src/router.tsx src/router-compat.css
          git commit -m "fix: improve authentication form UX"
          git push origin HEAD:main
