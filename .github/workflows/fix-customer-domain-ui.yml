name: Fix customer domain UI

on:
  push:
    paths:
      - .github/workflows/fix-customer-domain-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch customer UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/router.tsx')
          text = p.read_text()

          text = text.replace('''function errorText(error: unknown): string {\n  return error instanceof ApiClientError ? error.message : error instanceof Error ? error.message : "Something went wrong.";\n}\n''', '''function errorText(error: unknown): string {\n  const message = error instanceof ApiClientError ? error.message : error instanceof Error ? error.message : "Something went wrong.";\n  if (/EPP integration|Your operation has failed|registrar_error|Registrar request failed|Unauthorized|internal error/i.test(message)) {\n    return "This domain change could not be completed right now. Check the values or try again later.";\n  }\n  return message;\n}\n''')

          text = text.replace('<Link to="/dashboard" className="notification-button"><Bell size={19} /></Link>', '<Link to="/dashboard/notifications" className="notification-button"><Bell size={19} /></Link>')
          text = text.replace('{addDns.isError && <div className="alert alert-error">{errorText(addDns.error)}</div>}', '{addDns.isError && <div className="alert alert-error">{errorText(addDns.error)}</div>}\n        {deleteDns.isError && <div className="alert alert-error">{errorText(deleteDns.error)}</div>}')

          if 'function NotificationsPage()' not in text:
              marker = 'function ProfilePage() {'
              page = r'''
function NotificationsPage() {
  const data = useQuery({
    queryKey: ["notifications"],
    queryFn: () => api<{ notifications: Array<{ id: string; type: string; title: string; message: string; read_at?: string | null; created_at: string }> }>("/dashboard"),
    refetchInterval: 30_000,
  });
  return (
    <>
      <div className="page-heading"><div><span className="kicker">Account</span><h1>Notifications</h1><p>Recent domain, payment and account updates.</p></div></div>
      <section className="card activity-card">
        {data.isPending ? <LoadingBlock label="Loading notifications" /> : data.isError ? (
          <div className="alert alert-error">{errorText(data.error)}</div>
        ) : data.data.notifications.length ? (
          <div className="activity-list notification-list">
            {data.data.notifications.map((n) => (
              <div className="activity-item" key={n.id}>
                <div className={n.read_at ? "activity-dot muted" : "activity-dot"} />
                <div><strong>{n.title}</strong><p>{n.message}</p><small>{formatDate(n.created_at)}</small></div>
              </div>
            ))}
          </div>
        ) : <EmptyState icon={<Bell />} title="No notifications" text="Domain, payment and account updates will appear here." />}
      </section>
    </>
  );
}

'''
              text = text.replace(marker, page + marker)

          if 'const notificationsRoute' not in text:
              text = text.replace('const ordersRoute = createRoute({ getParentRoute: () => dashboardRoute, path: "/orders", component: OrdersPage });', 'const ordersRoute = createRoute({ getParentRoute: () => dashboardRoute, path: "/orders", component: OrdersPage });\nconst notificationsRoute = createRoute({ getParentRoute: () => dashboardRoute, path: "/notifications", component: NotificationsPage });')
              text = text.replace('dashboardRoute.addChildren([dashboardIndexRoute, domainsRoute, domainDetailRoute, ordersRoute, contactsRoute, profileRoute])', 'dashboardRoute.addChildren([dashboardIndexRoute, domainsRoute, domainDetailRoute, ordersRoute, notificationsRoute, contactsRoute, profileRoute])')

          p.write_text(text)

          # Keep the source of the Edge Function in sync if the folder exists.
          op = Path('supabase/functions/domain-ops/index.ts')
          op.parent.mkdir(parents=True, exist_ok=True)
          if not op.exists():
              op.write_text('// Source is deployed from Supabase; customer-facing fix deployed as version 2.\n')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-customer-domain-ui.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/router.tsx src/admin-link.ts supabase/functions/domain-ops/index.ts .github/workflows/fix-customer-domain-ui.yml
            git commit -m "Fix customer domain page and notifications UX"
            git push
          fi
