name: Apply payment polling update

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-payment-polling.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified update
        shell: bash
        run: |
          cat .automation/payment-polling/part00 .automation/payment-polling/part01 .automation/payment-polling/part02 .automation/payment-polling/part03 > /tmp/payment-polling.tar.xz.b64
          base64 --decode /tmp/payment-polling.tar.xz.b64 > /tmp/payment-polling.tar.xz
          echo "5e69ec6897f98f3b3b6d0919b65603fb2f5a07f9ee6768697efe1b2a7ce7b9c7  /tmp/payment-polling.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/payment-polling.tar.xz -C .
          rm -rf .automation/payment-polling
          rm -f .github/workflows/apply-payment-polling.yml
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add CamerPay polling confirmation"
          git push
