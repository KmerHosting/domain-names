name: Customer Copy Final Fix

on:
  push:
    paths:
      - .github/workflows/customer-copy-final-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Final wording fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          replacements = {
              'Create the order, then complete secure Secure checkout.': 'Create the order, then complete checkout.',
              'Create the order, then complete secure checkout.': 'Create the order, then complete checkout.',
              'Enter the current registrar EPP/auth code. It is encrypted before storage.': 'Enter the transfer authorization code from your current provider.',
              'Enter the current provider EPP/auth code. It is encrypted before storage.': 'Enter the transfer authorization code from your current provider.',
              'EPP / authorization code': 'Transfer authorization code',
              'Checking registrar availability': 'Checking domain availability',
              'Transfer lock': 'Domain lock',
              'Registrar lock': 'Domain lock',
              'registrar': 'domain provider',
              'Registrar': 'Domain provider',
          }
          for path in [Path('src/router.tsx'), Path('src/runtime-fixes.tsx'), Path('src/domain-control-patches.ts'), Path('src/provider-tools.ts')]:
              if not path.exists():
                  continue
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/customer-copy-final-fix.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/router.tsx src/runtime-fixes.tsx src/domain-control-patches.ts src/provider-tools.ts .github/workflows/customer-copy-final-fix.yml
            git commit -m "Fix remaining customer copy wording"
            git push
          fi
