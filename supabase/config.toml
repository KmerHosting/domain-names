# Domain APIs use KmerHosting's opaque domain session token. Supabase Auth JWT
# verification must therefore stay disabled at the Edge gateway; protected
# functions validate domain_sessions/domain_users internally before doing work.
[functions.domain-api]
verify_jwt = false

[functions.domain-platform-status]
verify_jwt = false

[functions.domain-search-fast]
verify_jwt = false

[functions.domain-wallet]
verify_jwt = false

[functions.domain-admin]
verify_jwt = false

[functions.domain-admin-user-safety]
verify_jwt = false

[functions.domain-admin-monitor]
verify_jwt = false

[functions.domain-operations-monitor]
verify_jwt = false

[functions.domain-ops]
verify_jwt = false

[functions.domain-documents]
verify_jwt = false

[functions.domain-order-guard]
verify_jwt = false

[functions.domain-customer-tools]
verify_jwt = false

[functions.domain-dns-tools]
verify_jwt = false

[functions.domain-provider-balance]
verify_jwt = false

[functions.domain-environment-status]
verify_jwt = false

[functions.domain-environment-switch]
verify_jwt = false

[functions.domain-environment-credit]
verify_jwt = false

[functions.domain-tld-provider-sync]
verify_jwt = false

# Internal automation endpoints authenticate with x-domain-cron-secret rather
# than a Supabase Auth JWT. The Edge gateway must let those requests reach the
# function body, where domain_internal_cron_secret is validated.
[functions.domain-jobs-v2]
verify_jwt = false

[functions.domain-automation-v2]
verify_jwt = false
